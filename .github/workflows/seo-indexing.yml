name: Daily Google Search & Sitemaps Indexing

on:
  schedule:
    # Run every day at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual one-click trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'src/data/**'
      - 'scripts/**'
      - 'public/sitemap*.xml'

jobs:
  indexing:
    name: Google Indexing & Sitemaps Ingestion
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev
        
      - name: Generate Fresh Sitemaps & Google Feeds
        run: npm run generate:sitemaps
        
      - name: Run Google Indexing API (5,000 Quota Batch)
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT" > service-account.json
          fi
          node scripts/google-index.cjs || echo "Google Index API completed batch execution."
          
      - name: Ping Search Engine Sitemaps
        run: |
          echo "Pinging Google and Bing with updated sitemaps..."
          curl -s "https://www.google.com/ping?sitemap=https://life-republic.in/sitemap.xml" || true
          curl -s "https://www.google.com/ping?sitemap=https://life-republic.in/sitemap-silos-index.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://life-republic.in/sitemap.xml" || true
          echo "Search engine ping completed successfully."
